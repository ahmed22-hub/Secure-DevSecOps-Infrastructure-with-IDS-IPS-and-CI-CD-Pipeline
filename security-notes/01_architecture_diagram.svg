<svg xmlns="http://www.w3.org/2000/svg" width="900" height="860" viewBox="0 0 900 860" role="img" aria-labelledby="title desc">
  <title id="title">Security Architecture Diagram - Day 1</title>
  <desc id="desc">Flow from User to Nginx, WAF, Firewall, Suricata, Docker App, and Logs plus Monitoring.</desc>
  <defs>
    <style>
      .bg { fill: #0f172a; }
      .title { fill: #e2e8f0; font: 700 28px Arial, sans-serif; }
      .subtitle { fill: #94a3b8; font: 400 16px Arial, sans-serif; }
      .box { fill: #1e293b; stroke: #38bdf8; stroke-width: 2; rx: 16; }
      .text { fill: #f8fafc; font: 600 22px Arial, sans-serif; text-anchor: middle; dominant-baseline: middle; }
      .small { fill: #cbd5e1; font: 400 14px Arial, sans-serif; text-anchor: middle; }
      .arrow { stroke: #f59e0b; stroke-width: 4; fill: none; marker-end: url(#head); }
      .note { fill: #111827; stroke: #22c55e; stroke-width: 1.5; rx: 10; }
      .note-text { fill: #dcfce7; font: 500 14px Arial, sans-serif; }
    </style>
    <marker id="head" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#f59e0b" />
    </marker>
  </defs>

  <rect class="bg" width="900" height="860" />
  <text x="450" y="52" class="title">Security Architecture - Day 1</text>
  <text x="450" y="82" class="subtitle">Secure-DevSecOps infrastructure flow and defensive layers</text>

  <rect x="285" y="120" width="330" height="72" class="box" rx="16"/>
  <text x="450" y="156" class="text">User</text>
  <text x="450" y="181" class="small">Internet browser / client requests</text>

  <path d="M450 192 L450 232" class="arrow"/>

  <rect x="285" y="232" width="330" height="72" class="box" rx="16"/>
  <text x="450" y="268" class="text">Nginx</text>
  <text x="450" y="293" class="small">Reverse proxy and public entry point</text>

  <path d="M450 304 L450 344" class="arrow"/>

  <rect x="285" y="344" width="330" height="72" class="box" rx="16"/>
  <text x="450" y="380" class="text">WAF</text>
  <text x="450" y="405" class="small">ModSecurity request filtering</text>

  <path d="M450 416 L450 456" class="arrow"/>

  <rect x="285" y="456" width="330" height="72" class="box" rx="16"/>
  <text x="450" y="492" class="text">Firewall</text>
  <text x="450" y="517" class="small">UFW / iptables network controls</text>

  <path d="M450 528 L450 568" class="arrow"/>

  <rect x="285" y="568" width="330" height="72" class="box" rx="16"/>
  <text x="450" y="604" class="text">Suricata</text>
  <text x="450" y="629" class="small">IDS/IPS detection and prevention</text>

  <path d="M450 640 L450 680" class="arrow"/>

  <rect x="285" y="680" width="330" height="72" class="box" rx="16"/>
  <text x="450" y="716" class="text">Docker (App)</text>
  <text x="450" y="741" class="small">Containerized web application runtime</text>

  <path d="M450 752 L450 792" class="arrow"/>

  <rect x="285" y="792" width="330" height="52" class="box" rx="16"/>
  <text x="450" y="818" class="text">Logs + Monitoring</text>

  <rect x="40" y="190" width="200" height="110" class="note" rx="10"/>
  <text x="60" y="220" class="note-text">Attack surface:</text>
  <text x="60" y="245" class="note-text">• HTTP/HTTPS</text>
  <text x="60" y="268" class="note-text">• SSH</text>
  <text x="60" y="291" class="note-text">• /login and /api</text>

  <rect x="660" y="190" width="200" height="110" class="note" rx="10"/>
  <text x="680" y="220" class="note-text">Assumptions:</text>
  <text x="680" y="245" class="note-text">• Only Nginx is public</text>
  <text x="680" y="268" class="note-text">• Internal services private</text>
  <text x="680" y="291" class="note-text">• Monitoring stays active</text>
</svg>
