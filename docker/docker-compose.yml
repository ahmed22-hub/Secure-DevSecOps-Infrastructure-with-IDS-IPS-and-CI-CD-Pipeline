services:
  web:
    build: ../app
    container_name: flask_app
    expose:
      - "5000"
    environment:
      - PORT=5000
      - DEBUG=True
      - ADMIN_USERNAME=admin
      - ADMIN_PASSWORD=admin
    networks:
      - app-network

  nginx:
    image: nginx:latest
    container_name: nginx_proxy
    ports:
      - "80:80"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf
      - ../nginx/error.html:/usr/share/nginx/html/error.html
    depends_on:
      - web
    networks:
      - app-network

networks:
  app-network:
