services:
  web:
    build: ../app
    container_name: flask_app
    expose:
      - "5000"
    environment:
      - PORT=5000
      - DEBUG=True
      - ADMIN_USERNAME=admin
      - ADMIN_PASSWORD=admin
    networks:
      - internal-network


    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  nginx:
    image: nginx:latest
    container_name: nginx_proxy
    ports:
      - "80:80"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf
      - ../nginx/error.html:/usr/share/nginx/html/error.html
    depends_on:
      - web
    networks:
      - public-network
      - internal-network

networks:
  public-network:
  internal-network:
