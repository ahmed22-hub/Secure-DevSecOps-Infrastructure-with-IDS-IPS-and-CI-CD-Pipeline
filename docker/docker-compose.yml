services:
  web:
    build: ../app
    container_name: flask_app
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - DEBUG=True
      - ADMIN_USERNAME=admin
      - ADMIN_PASSWORD=admin
    networks:
      - internal-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

networks:
  internal-network:
