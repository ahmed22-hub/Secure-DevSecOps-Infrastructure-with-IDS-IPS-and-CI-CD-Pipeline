events {}

http {


    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    server {
        listen 80;

        location / {
            proxy_pass http://web:5000;
        }

        error_page 500 502 503 504 /error.html;

        location = /error.html {
            root /usr/share/nginx/html;
        }
    }
}

